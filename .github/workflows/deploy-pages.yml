name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/artisun-website-access-dnwu32
  workflow_dispatch:
  # Journal posts are pulled from Shopify at build time. Rebuild a few times a
  # day so new or edited posts go live without a code push. To publish right
  # away: Actions → Deploy to GitHub Pages → Run workflow.
  schedule:
    - cron: '30 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # puppeteer is only used for local screenshot tooling; skip its
          # Chrome download to keep CI fast.
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - name: Build static export
        # Moves the server-only app/api routes aside for the export (see scripts/build-static.mjs).
        run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: /artisun
          # Repo → Settings → Secrets and variables → Actions. Needed for the
          # Journal (and the cart) — without them the blog builds empty.
          NEXT_PUBLIC_SHOPIFY_DOMAIN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_DOMAIN }}
          NEXT_PUBLIC_SHOPIFY_PUBLIC_TOKEN: ${{ secrets.NEXT_PUBLIC_SHOPIFY_PUBLIC_TOKEN }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
